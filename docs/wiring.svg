<text x="898" y="766" class="name" text-anchor="start">Rules</text>
<text x="898" y="790" class="pin" text-anchor="start">1.  Arduino GND must connect to the supply −.</text>
<text x="898" y="810" class="pin" text-anchor="start">2.  Never power servos from the Arduino 5 V pin.</text>
<text x="898" y="830" class="pin" text-anchor="start">3.  Keep the amp on its own USB charger.</text>
<text x="898" y="850" class="pin" text-anchor="start">4.  Never tie the amp's L− and R− together.</text>
<text x="898" y="870" class="pin" text-anchor="start">5.  Leave a loose loop so the head can turn ±60°.</text>
