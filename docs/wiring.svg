  .pin { font-size: 12px; }
  .lab { font-size: 11.5px; fill: #6b6259; }
  .rail { font-size: 13px; font-weight: 700; }
  .block { fill: #ffffff; stroke: #2b2622; stroke-width: 1.5; }
  .note { fill: #f4ecdd; stroke: #d8cbb3; stroke-width: 1; }
  .wire { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .pad { fill: #ffffff; stroke: #2b2622; stroke-width: 1.5; }
</style>
