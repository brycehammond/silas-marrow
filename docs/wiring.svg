<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" width="1280" height="920" role="img" aria-labelledby="t d">
<title id="t">Silas Marrow wiring diagram</title>
<desc id="d">Arduino Uno pins D9, D10 and D11 drive the jaw, pan and tilt servo signals. Pin D6 drives two chained WS2812 eye jewels through a 330 ohm resistor. A 5 volt 5 amp supply powers the servos and eyes and shares ground with the Arduino. The Mac mini connects to the Arduino and the camera over USB, and its headphone jack feeds a PAM8403 amplifier and a 40 mm speaker. The amplifier has its own USB charger.</desc>
