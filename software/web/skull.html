<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silas Marrow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='14' r='11' fill='%23e3d8c0'/%3E%3Crect x='10' y='20' width='12' height='8' rx='2' fill='%23e3d8c0'/%3E%3Ccircle cx='12' cy='14' r='3' fill='%23ff2000'/%3E%3Ccircle cx='20' cy='14' r='3' fill='%23ff2000'/%3E%3C/svg%3E">
<style>
  :root { --fg: #efe6da; --dim: #a8998a; --accent: #d9822b; }
  html, body { margin: 0; height: 100%; background: #070504; overflow: hidden; }
  body {
    color: var(--fg);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    background: radial-gradient(ellipse 75% 65% at 50% 42%, #2a1c12 0%, #150e09 45%, #060403 100%);
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #shade { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 80% 80% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%); }
  #ui { position: fixed; inset: 0; pointer-events: none; transition: opacity .4s; }
  body.bare #ui { opacity: 0; }
  #chip { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 16px;
    font: 500 12px/1 -apple-system, system-ui, sans-serif; letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim); display: flex; gap: 8px; align-items: center; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #5a4a3c; transition: background .3s; }
  #chip[data-state="speaking"] #dot { background: var(--accent); }
  #chip[data-state="listening"] #dot { background: #6fb36f; }
  #chip[data-state="thinking"] #dot { background: #c9b458; }
  #chip[data-state="offline"] #dot { background: #b3261e; }
  #line { position: absolute; left: 50%; bottom: max(7vh, 28px); transform: translateX(-50%);
    width: min(86vw, 900px); text-align: center; font-size: clamp(18px, 2.6vw, 34px);
    line-height: 1.3; text-shadow: 0 2px 12px #000, 0 0 2px #000; opacity: 0;
    transition: opacity .6s; text-wrap: balance; }
  #line.on { opacity: 1; }
  #line.heard { color: var(--dim); font-style: italic; }
  @media (max-width: 700px) {        /* keep the words clear of the camera picture */
    #line { bottom: calc(40px + min(24vw, 300px) * 0.5625); }
  }
  #cam { position: absolute; right: 16px; bottom: 16px; width: min(24vw, 300px);
    border-radius: 8px; opacity: .85; box-shadow: 0 4px 24px rgba(0,0,0,.6); display: none; }
  #cam.on { display: block; }
  #keys { position: absolute; right: 16px; top: max(14px, env(safe-area-inset-top));
    font: 12px/1 -apple-system, system-ui, sans-serif; color: var(--dim); opacity: .7;
    transition: opacity 1.5s; }
  #keys.gone { opacity: 0; }
  #wake { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim);
    font-size: 20px; font-style: italic; transition: opacity .8s; pointer-events: none; }
  #wake.gone { opacity: 0; }
</style>
<script type="importmap">{ "imports": { "three": "/web/vendor/three.module.min.js" } }</script>
</head><body>
<canvas id="view"></canvas>
<div id="shade"></div>
<div id="wake">Raising the dead&hellip;</div>
<div id="ui">
  <div id="chip" data-state="offline"><span id="dot"></span><span id="state">connecting</span></div>
  <div id="keys">F full screen &nbsp; C camera &nbsp; H hide</div>
  <div id="line"></div>
  <img id="cam" alt="What the skull sees">
</div>
<script type="module" src="/web/skull.js"></script>
</body></html>
